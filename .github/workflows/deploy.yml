name: deploy skippymart-products-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy_skippymart-products-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Install zip tool
        uses: montudor/action-zip@v1

      - name: Create Zip file for Lambda function
        run: zip -r code.zip .

      - name: Create or Update AWS Lambda
        run: |
          FUNCTION_NAME="skippymart-products-api"
          REGION="${{ secrets.AWS_REGION }}"
          ROLE_ARN="${{ secrets.IAM_ROLE }}"
          ZIP_FILE="fileb://code.zip"
          RUNTIME="nodejs20.x" # <-- CHANGE THIS to your runtime (e.g., python3.11, go1.x)
          HANDLER="index.handler" # <-- CHANGE THIS to your handler file and function name

          echo "Checking if Lambda function exists..."
          if aws lambda get-function --function-name "$FUNCTION_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "Function exists. Updating code..."
            aws lambda update-function-code \
              --function-name "$FUNCTION_NAME" \
              --zip-file "$ZIP_FILE" \
              --region "$REGION"
          else
            echo "Function does not exist. Creating new function..."
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime "$RUNTIME" \
              --role "$ROLE_ARN" \
              --handler "$HANDLER" \
              --zip-file "$ZIP_FILE" \
              --region "$REGION"
          fi
